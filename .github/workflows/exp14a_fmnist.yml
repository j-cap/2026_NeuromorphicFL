name: Experiment 14A Fashion-MNIST

on:
  push:
    paths:
      - '.github/workflows/exp14a_fmnist.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exp14a:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas
      - name: Run audit
        run: PYTHONPATH=src python experiments/14a_fmnist_binary.py --phase audit
      - name: Commit observed audit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/results/14a_fmnist_binary
          if ! git diff --cached --quiet; then
            git commit -m 'Add Experiment 14A observed audit results'
            git push
          fi
