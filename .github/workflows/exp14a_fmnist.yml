name: Experiment 14A Fashion-MNIST

on:
  push:
    paths:
      - '.github/workflows/exp14a_fmnist.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exp14a:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas
      - name: Run baseline tuning audit
        run: PYTHONPATH=src python experiments/14a_baseline_refine.py
