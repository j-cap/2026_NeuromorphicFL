name: Experiment 14C Instrumentation Repro Check

on:
  push:
    paths:
      - '.github/workflows/exp14c_repro_check.yml'
      - 'experiments/14c_instrumentation_repro_check.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip numpy==2.4.6 pandas==3.0.5 scipy
      - run: PYTHONPATH=src python experiments/14c_instrumentation_repro_check.py
