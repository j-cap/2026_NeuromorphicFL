name: Experiment 15A CNN Long Horizon

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exp15a-long:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python -m pip install --upgrade pip numpy==2.4.6 pandas==3.0.5
      - name: Run Experiment 15A long horizon
        run: PYTHONPATH=src python experiments/15a_cnn_long_horizon.py
      - name: Upload Experiment 15A long horizon
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: exp15a-long-horizon
          path: experiments/results/15a_fmnist_cnn/
