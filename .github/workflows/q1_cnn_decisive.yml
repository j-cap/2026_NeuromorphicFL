name: Q1 Decisive CNN Bridge

on:
  push:
    paths:
      - 'experiments/q1_cnn_decisive.py'
      - '.github/workflows/q1_cnn_decisive.yml'
  workflow_dispatch:

jobs:
  q1-cnn-decisive:
    runs-on: ubuntu-24.04
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python -m pip install --upgrade pip numpy==2.4.6 pandas==3.0.5
      - name: Run decisive CNN bridge
        run: PYTHONPATH=src python experiments/q1_cnn_decisive.py
      - uses: actions/upload-artifact@v4
        with:
          name: q1-cnn-decisive
          path: experiments/results/q1_nearest_neighbor_focused/cnn_decisive_650.csv
