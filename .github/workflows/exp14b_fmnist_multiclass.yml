name: Experiment 14B Fashion-MNIST Multiclass

on:
  push:
    paths:
      - '.github/workflows/exp14b_fmnist_multiclass.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exp14b:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python -m pip install --upgrade pip numpy==2.4.6 pandas==3.0.5
      - name: Run deterministic multiclass campaign
        run: PYTHONPATH=src python experiments/14b_deterministic_campaign.py
