name: T4 Defect Decomposition and Quantum Schedule

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/neuromorphicfl/final_baseline_campaign.py'
      - 'experiments/t4_defect_schedule.py'
      - '.github/workflows/t4_defect_schedule.yml'
  push:
    paths:
      - 'src/neuromorphicfl/final_baseline_campaign.py'
      - 'experiments/t4_defect_schedule.py'
      - '.github/workflows/t4_defect_schedule.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python -m pip install --upgrade pip numpy==2.4.6 pandas==3.0.5 matplotlib==3.10.8
      - name: Verify T3 compatibility and T4 identities
        run: |
          PYTHONPATH=src python experiments/t3_alignment_audit.py --smoke
          PYTHONPATH=src python experiments/t4_defect_schedule.py --smoke

  experiment:
    needs: smoke
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, admissible, admissible_matched]
        partition_seed: [2500, 2600, 2700]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python -m pip install --upgrade pip numpy==2.4.6 pandas==3.0.5 matplotlib==3.10.8
      - name: Run T4 point
        run: |
          TRAIN_SEED=$((70000 + ${{ matrix.partition_seed }}))
          PYTHONPATH=src python experiments/t4_defect_schedule.py \
            --variant "${{ matrix.variant }}" \
            --partition-seed "${{ matrix.partition_seed }}" \
            --train-seed "$TRAIN_SEED" \
            --audit-stride 5 \
            --reference-per-client 500
      - uses: actions/upload-artifact@v4
        with:
          name: t4-${{ matrix.variant }}-${{ matrix.partition_seed }}
          path: experiments/results/t4_defect_schedule/*_${{ matrix.variant }}_p${{ matrix.partition_seed }}_*.csv

  aggregate:
    needs: experiment
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python -m pip install --upgrade pip numpy==2.4.6 pandas==3.0.5 matplotlib==3.10.8
      - uses: actions/download-artifact@v4
        with:
          pattern: t4-*
          merge-multiple: true
          path: experiments/results/t4_defect_schedule
      - name: Aggregate T4 results
        run: PYTHONPATH=src python experiments/t4_defect_schedule.py --aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: t4-defect-schedule-combined
          path: |
            experiments/results/t4_defect_schedule/combined_summary.csv
            experiments/results/t4_defect_schedule/combined_rounds.csv
            experiments/results/t4_defect_schedule/aggregate_metrics.csv
            experiments/results/t4_defect_schedule/t4_defect_schedule_summary.png
            experiments/results/t4_defect_schedule/t4_defect_schedule_summary.pdf
