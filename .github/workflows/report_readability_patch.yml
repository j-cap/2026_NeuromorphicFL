name: Apply Report Readability Patch

on:
  push:
    paths:
      - '.github/workflows/report_readability_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply LaTeX readability patch
        run: python tools/run_report_readability_patch.py
      - name: Commit report updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Improve report figures, tables, and takeaway blocks"
            git push
          fi
