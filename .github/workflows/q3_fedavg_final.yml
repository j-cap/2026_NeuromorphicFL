name: Q3 Final FedAvg Compatibility

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  q3-final:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        mode: [mlp1, mlp5, mlp10, cnn]
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      BLIS_NUM_THREADS: 1
      NUMEXPR_NUM_THREADS: 1
      PYTHONHASHSEED: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python -m pip install --upgrade pip numpy==2.4.6 pandas==3.0.5
      - name: Run Q3 final campaign
        run: PYTHONPATH=src python experiments/q3_fedavg_final.py --mode ${{ matrix.mode }}
      - name: Upload Q3 final results
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: q3-final-${{ matrix.mode }}
          path: experiments/results/q3_fedavg_compatibility/
