name: Q1 Strom Nearest-Neighbor Audit

on:
  push:
    paths:
      - 'src/neuromorphicfl/q1_nearest_neighbor.py'
      - 'experiments/q1_strom_nearest_neighbor.py'
      - '.github/workflows/q1_strom_nearest_neighbor.yml'
  workflow_dispatch:

jobs:
  q1-nearest-neighbor:
    runs-on: ubuntu-24.04
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python -m pip install --upgrade pip numpy==2.4.6 pandas==3.0.5
      - name: Run Q1 nearest-neighbor audit
        run: PYTHONPATH=src python experiments/q1_strom_nearest_neighbor.py
      - name: Upload Q1 nearest-neighbor results
        uses: actions/upload-artifact@v4
        with:
          name: q1-nearest-neighbor
          path: experiments/results/q1_nearest_neighbor/
