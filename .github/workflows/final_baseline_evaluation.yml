name: Final Baseline Held-Out Evaluation

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        architecture: [mlp, cnn]
        method: [event, strom, ef_topk, sign_ef, dense]
        partition_seed: [2500, 2600, 2700]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python -m pip install --upgrade pip numpy==2.4.6 pandas==3.0.5
      - name: Run held-out point
        shell: bash
        run: |
          VALUE_ARGS=()
          if [ "${{ matrix.method }}" = "ef_topk" ]; then
            VALUE_ARGS=(--value 0.05)
          elif [ "${{ matrix.method }}" = "strom" ]; then
            if [ "${{ matrix.architecture }}" = "mlp" ]; then
              VALUE_ARGS=(--value 0.00125)
            else
              VALUE_ARGS=(--value 0.005)
            fi
          fi
          TRAIN_SEED=$((70000 + ${{ matrix.partition_seed }}))
          PYTHONPATH=src python experiments/final_baseline_point.py \
            --architecture "${{ matrix.architecture }}" \
            --method "${{ matrix.method }}" \
            "${VALUE_ARGS[@]}" \
            --partition-seed "${{ matrix.partition_seed }}" \
            --train-seed "$TRAIN_SEED" \
            --tag eval
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: eval-${{ matrix.architecture }}-${{ matrix.method }}-${{ matrix.partition_seed }}
          path: experiments/results/final_baseline_campaign/*_eval.csv

  aggregate:
    needs: evaluate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas==3.0.5
      - uses: actions/download-artifact@v4
        with:
          pattern: eval-*
          merge-multiple: true
          path: experiments/results/final_baseline_campaign
      - name: Aggregate held-out results
        run: python experiments/final_baseline_aggregate.py --tag eval
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: final-baseline-heldout-combined
          path: experiments/results/final_baseline_campaign/combined_eval.csv
