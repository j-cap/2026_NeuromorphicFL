name: Q1 Focused Strom Audit

on:
  push:
    paths:
      - 'experiments/q1_strom_focused.py'
      - '.github/workflows/q1_strom_focused.yml'
  workflow_dispatch:

jobs:
  q1-focused:
    strategy:
      matrix:
        architecture: [mlp, cnn]
    runs-on: ubuntu-24.04
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python -m pip install --upgrade pip numpy==2.4.6 pandas==3.0.5
      - name: Run focused Q1 audit
        run: PYTHONPATH=src python experiments/q1_strom_focused.py --architecture ${{ matrix.architecture }}
      - name: Upload focused Q1 results
        uses: actions/upload-artifact@v4
        with:
          name: q1-focused-${{ matrix.architecture }}
          path: experiments/results/q1_nearest_neighbor_focused/${{ matrix.architecture }}_650.csv
